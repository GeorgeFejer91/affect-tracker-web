[package]
name = "affect-tracker-vr-lsl"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.21.1"
labstream = "=0.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
