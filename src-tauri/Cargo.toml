[package]
name = "affect-tracker-desktop"
version = "0.2.0"
description = "Offline Tauri companion for the Affect Tracker"
authors = ["George Fejer"]
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/GeorgeFejer91/affect-tracker-web"

[lib]
name = "affect_tracker_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
labstream = { version = "0.1.0", optional = true }
monio = "0.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
uuid = { version = "1", features = ["serde", "v4"] }

[features]
default = ["lsl-streaming"]
lsl-streaming = ["dep:labstream"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
