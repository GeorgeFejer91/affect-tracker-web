[package]
name = "affect-tracker-study-core"
version = "0.1.0"
description = "Platform-neutral study contracts and authoritative reducer for Affect Tracker"
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/GeorgeFejer91/affect-tracker-web"
publish = false

[lib]
name = "affect_tracker_study_core"
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
wasm-bindgen = { version = "0.2", optional = true }

[dev-dependencies]
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"
