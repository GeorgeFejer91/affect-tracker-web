<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Affect overlay</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body class="overlay-body">
    <main id="overlay-surface" aria-label="Floating affect tracker overlay">
      <svg id="overlay-flubber" viewBox="-1.62 -1.62 3.24 3.24" role="img" aria-label="Current valence and arousal">
        <defs><filter id="soft-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="0.10"></feGaussianBlur></filter></defs>
        <path class="shape-halo"></path><path class="shape-base"></path><path class="shape-outline"></path>
      </svg>
      <span class="edit-badge" aria-hidden="true">Drag to position · lock when done</span>
    </main>
    <script type="module" src="./src/overlay.js"></script>
  </body>
</html>
