name: Test and deploy Affect Research Pages

on:
  push:
    branches: [main, research/video-protocol-v1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Research contract and browser tests
        run: pnpm test
      - name: Build the shared desktop WebView
        run: pnpm desktop:build
      - name: Build the isolated Research Pages artifact
        run: pnpm build:pages
      - name: Upload isolated Research Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: affect-research-pages
          path: dist-pages
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Download validated Research Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: affect-research-pages
          path: dist-pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static Research site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
