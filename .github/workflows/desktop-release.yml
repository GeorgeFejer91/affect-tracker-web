name: Package internal Affect Research alpha (not research-ready)

run-name: Internal Affect Research 0.4.0-alpha.1 Windows package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-windows-alpha:
    name: Validate and package unsigned Windows alpha
    runs-on: windows-latest
    env:
      AFFECT_RESEARCH_REQUIRE_LIBVLC_RUNTIME: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Research tests
        run: pnpm test
      - name: Build focused desktop WebView
        run: pnpm desktop:build
      - name: Stage pinned libVLC 3.0.23 runtime
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'vlc-3.0.23-win64.zip'
          Invoke-WebRequest -Uri 'https://download.videolan.org/pub/videolan/vlc/3.0.23/win64/vlc-3.0.23-win64.zip' -OutFile $archive
          ./src-tauri/native-media/stage-libvlc-runtime.ps1 -ArchivePath $archive
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Check native Research backend
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Test native Research backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Lint native Research backend
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Build unsigned Windows alpha
        run: pnpm desktop:bundle
      - name: Upload internal-only alpha artifact
        uses: actions/upload-artifact@v4
        with:
          name: affect-research-0.4.0-alpha.1-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

# This workflow intentionally creates no GitHub Release and accepts no tag trigger.
# Research-ready and stable publishing remain blocked on the charter qualification gates.
