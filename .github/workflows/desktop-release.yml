name: Desktop release packages

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            build_args: --bundles nsis
            artifact_name: affect-tracker-desktop-windows-x64
            artifact_paths: src-tauri/target/release/bundle/nsis/*.exe
          - label: Linux x64
            os: ubuntu-24.04
            build_args: --bundles appimage,deb
            artifact_name: affect-tracker-desktop-linux-x64
            artifact_paths: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
          - label: macOS universal
            os: macos-latest
            build_args: --target universal-apple-darwin --bundles dmg
            artifact_name: affect-tracker-desktop-macos-universal
            artifact_paths: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Test shared frontend
        run: pnpm test
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Add universal macOS Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build native packages
        run: pnpm tauri build ${{ matrix.build_args }}
      - name: Upload native packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error

