name: Affect Research Windows checks

on:
  push:
    branches: [main, research/video-protocol-v1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit frontend dependencies
        run: pnpm audit --audit-level=moderate
      - name: Run Research tests
        run: pnpm test
      - name: Build focused desktop WebView
        run: pnpm desktop:build
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Check native Research backend
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Test native Research backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Lint native Research backend
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Build unsigned internal Windows alpha
        run: pnpm desktop:bundle
      - name: Upload internal alpha installer
        uses: actions/upload-artifact@v4
        with:
          name: affect-research-0.4.0-alpha.1-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
