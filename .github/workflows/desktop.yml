name: Desktop companion checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-and-desktop-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Test browser implementation
        run: pnpm test
      - name: Build desktop WebViews
        run: pnpm desktop:build

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libx11-dev libxi-dev libxtst-dev libxdo-dev
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build desktop WebViews
        run: pnpm desktop:build
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Check Rust formatting
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Check Rust
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Test Rust
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Lint Rust
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Build unsigned Windows installer
        if: runner.os == 'Windows'
        run: pnpm desktop:bundle
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: affect-tracker-desktop-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
